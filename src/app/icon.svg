<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The product's own subject: one split, two branches, unequal codes.
    The 1-branch carries the accent, exactly as it does in the app.
    The neutral half flips with the browser chrome so the mark reads on
    a light tab strip and a dark one.
  -->
  <style>
    .ink { stroke: #334155; }
    .dot { fill: #334155; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #CBD5E1; }
      .dot { fill: #CBD5E1; }
    }
  </style>
  <g fill="none" stroke-width="3.5" stroke-linecap="round">
    <path class="ink" d="M16 6.5 L6 25.5"/>
    <path d="M16 6.5 L26 25.5" stroke="#22C55E"/>
  </g>
  <circle class="dot" cx="16" cy="6.5" r="4.5"/>
  <circle class="dot" cx="6" cy="25.5" r="4.5"/>
  <circle cx="26" cy="25.5" r="4.5" fill="#22C55E"/>
</svg>
